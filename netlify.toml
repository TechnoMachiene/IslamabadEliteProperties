[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  # "netlify dev" runs Vite on targetPort and proxies through port
  command    = "npm run dev"
  port       = 8888
  targetPort = 8080
  framework  = "#custom"

# Proxy /api/* to Netlify Functions (keeps URLs clean in production)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

# SPA fallback — must be last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
